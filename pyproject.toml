[project]
name = "action-refresh"
version = "0.0.0"
description = "Action-Aware Predictive Refresh for Efficient World-Action Models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "internal-research" }
authors = [{ name = "Agustin Nahuel Coppari Hollmann", email = "copparihollmann@gmail.com" }]

dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "orjson>=3.10",
    "pynvml>=11.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scipy>=1.13",
]

[project.optional-dependencies]
# torch is pinned via extra-index-url in uv config below; version chosen for cu128/cu130 later
torch = [
    "torch>=2.5",
    "torchvision>=0.20",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]
profile = [
    "py-spy>=0.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/action_refresh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "gpu: requires an NVIDIA GPU",
    "cosmos: requires Cosmos framework installed",
    "robolab: requires RoboLab / Isaac Sim installed",
    "slow: takes more than 10s",
]
