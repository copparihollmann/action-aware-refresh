# Deployment topology for this host.
# Derived from docs/environment_report.md. Adjust per machine.
#
# Regenerate the GPU facts with:
#   nvidia-smi --query-gpu=index,uuid,name,memory.total,compute_cap,pci.bus_id --format=csv
name: single_host_multi_gpu

host: firesim2

# GPU assignment — 4x NVIDIA L40S, 46068 MiB (45.0 GiB) each, SM 8.9 (Ada),
# driver 580.126.18. `nvidia-smi topo -m` shows PCIe-switch pairs (0,1) and
# (2,3), so Cosmos and Isaac Sim are placed on *different* switches to keep
# their host-to-device traffic off a shared link.
#
# `cuda_visible_devices` is the index form we actually export: Omniverse Kit
# selects its render device by index, so UUID-form CUDA_VISIBLE_DEVICES is
# avoided for the RoboLab side. `uuid` is recorded so every run can assert it
# got the GPU it thinks it did (indices renumber; UUIDs do not), and
# `nvml_index` is the *physical* index NVML needs for power sampling — NVML
# ignores CUDA_VISIBLE_DEVICES, so these must be resolved separately.
#
# Shared machine: check `nvidia-smi` for other users before timing runs.
gpus:
  cosmos_server:
    cuda_visible_devices: "0"
    uuid: "GPU-a2a44f60-c7d1-4450-93df-ead875ea76e8"
    nvml_index: 0
    role: "policy server (Cosmos3-Nano-Policy-DROID)"
  robolab_client:
    cuda_visible_devices: "2"
    uuid: "GPU-22350958-ee15-b07b-0e89-77c5157f1d3b"
    nvml_index: 2
    role: "RoboLab / Isaac Sim"

# GPUs 1 and 3 are intentionally unassigned: spare capacity for later
# parallel sweeps. Do NOT shard the baseline model across them — the baseline
# must stay a single-GPU configuration so its cost is comparable to methods.
spare_cuda_devices: ["1", "3"]

# VRAM budget on the Cosmos GPU. The checkpoint is 32.9 GB of bf16 weights
# (~30.4 GB transformer ~= 15.2B params, 1.4 GB VAE, 1.2 GB vision encoder)
# against 45.0 GiB usable, leaving ~14 GiB for activations/workspace. Batched
# multi-env requests may not fit; measure before assuming.
vram_total_gib_per_gpu: 45.0
vram_weights_gib_estimate: 30.7

# Network — both services live on this host, talk over loopback.
cosmos_host: "127.0.0.1"
cosmos_port: 8000

# Persistent caches — avoid re-downloading model weights and wheels.
# Kept on /scratch so the uv cache is on the SAME filesystem as the venvs
# (uv hardlinks instead of copying). /scratch is shared and was 96% full
# (134 GB free) when this was written: check `df -h /scratch` before installs.
shared_hf_cache:  "/scratch/agustin/robotics/cache/huggingface"
uv_cache:         "/scratch/agustin/robotics/cache/uv"
model_cache_root: "/scratch/agustin/robotics/cache/models"
output_root:      "/scratch/agustin/robotics/action-aware-refresh/results"

# Omniverse/Isaac caches default into $HOME (60 GB NFS); redirect to /scratch.
ov_cache_root: "/scratch/agustin/robotics/cache/ov"
ov_data_root:  "/scratch/agustin/robotics/cache/ov-data"

# Clock synchronization: single host, so all wall-times share the same clock.
# For CUDA-event timing, use torch.cuda.Event.record()/.elapsed_time() and
# synchronize only at controlled boundaries.
#
# CPU contention is the measurement hazard on this host (not GPU contention):
# the GPUs' CPU affinity is cores 0-15,32-47 and other users run large
# parallel compiles. Record loadavg + a process snapshot with every timed run.
cpu_affinity_for_gpus: "0-15,32-47"
