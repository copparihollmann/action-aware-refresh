# Screened subset, derived from MEASURED baseline_full results (2026-08-04), not chosen
# by hand. Spec §10 asks for tasks whose baseline success is neither always 0 nor always
# 1; that is an empirical property, so it needed the baseline pass to identify.
#
# Why this exists: closed-loop cost is dominated by the simulator (policy inference was
# only 16.8% of wall time) and *failing* tasks run to their full timeout while successes
# terminate early. So the 9 baseline failures cost 4.7 of 5.4 GPU-h while the 5 successes
# cost 0.7. A full-pilot pass per method is ~7.3 GPU-h, which does not fit the budget for
# three more methods.
#
# Composition, and what each part is for:
#   - the 5 tasks the baseline SOLVED -> detect degradation, which is the main risk for a
#     cheaper policy. A method cannot do worse than 0, so a task the baseline already
#     fails cannot show degradation at all.
#   - the 4 CHEAPEST tasks the baseline failed -> retain the ability to detect improvement,
#     without paying for the six most expensive saturated tasks.
#
# Cost: ~84 min/method (1.40 GPU-h) versus ~7.3 GPU-h for the full pilot.
#
# Honest limitation: comparisons on this set are macro-averaged over 9 tasks, not 16, and
# it is biased toward tasks the baseline finds easy or cheap. It is a screening set for
# deciding what deserves a full-pilot run — not a substitute for one.
pilot_screened:
  screened: true
  derived_from: baseline_full closed-loop pass, 15/16 pilot tasks, 1 episode each
  tasks:
    # baseline succeeded 1/1
    - BowlStackingLeftOnRightTask
    - BananaThenRubiksCubeTask
    - ReorientJugTask
    - RubiksCubeAndBananaTask
    - Stack3RubiksCubeTask
    # baseline failed 0/1, cheapest four
    - BlockStackingSpecifiedOrderTask
    - BlockStackingOrderAgnosticTask
    - BigPumpkinInBinTask
    - BlackItemsInBinTask
  excluded_saturated_and_expensive:
    # all failed 0/1 under the baseline and cost 25-71 min each
    - AppleAndYogurtInBowlTask
    - CookingClearPlateTask
    - ClutterPlasticTask
    - FruitsOnPlate3Task
    - ClearOrganicObjectsTask
    - FruitsOnPlateTask
  not_measured:
    # 16th pilot task; omitted from the baseline pass for budget (300 s episode, ~62 min)
    - CleanUpToysTask
